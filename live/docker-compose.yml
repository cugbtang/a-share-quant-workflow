# 监控栈：Prometheus + Grafana + node-exporter。
# 启动：docker compose up -d
# Grafana 默认 http://localhost:3000 （admin/admin，首次登录请改密）
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: quant-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitor/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --rules.alert.file=/etc/prometheus/alerts.yml

  grafana:
    image: grafana/grafana:latest
    container_name: quant-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitor/grafana_dashboard.json:/var/lib/grafana/dashboards/quant_live.json:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: quant-node-exporter
    ports:
      - "9100:9100"
